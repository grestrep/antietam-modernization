; ---------------------------------------------------------------------------
;  smav2 ddraw.dll settings.  Keep this file next to ddraw.dll in the game
;  folder.  Missing file or keys = built-in defaults (windowed, scale auto,
;  filter auto, everything else on).  Changes take effect the next time the
;  game starts.
; ---------------------------------------------------------------------------
[display]
; borderless = covers the whole monitor; the 800x600 game picture is enlarged
;              by a whole factor (see scale) and centred, black bars around it
; windowed   = a normal window with a title bar; it can be moved, resized and
;              maximised (the picture keeps 4:3, black bars when maximised)
; exclusive  = real fullscreen: the monitor switches to 800x600 (full colour) and
;              the picture is shown 1:1 through Direct3D 11. Your monitor stretches
;              it (softer, slightly too wide on widescreen). Alt-Tab leaves/re-enters
;              fullscreen. Falls back to borderless 1:1 if the switch fails.
; fullscreen = original behaviour (real switch to 800x600, 256 colours); the DLL
;              only passes calls through to Windows - use this to "turn it off"
mode=borderless
;mode=exclusive

; borderless (and windowed without window_size): how much to enlarge the picture
;   auto = the largest whole factor that fits (1920x1200 monitor: 2 -> 1600x1200)
;   1, 2, 3 ... = fixed factor (reduced automatically if it does not fit)
scale=auto

; windowed only: size of the picture area (client area) of the window.
; Any size works; 4:3 sizes fill it exactly, e.g.:
;window_size=1024x768
;window_size=1152x864
;window_size=1280x960
;window_size=1600x1200
; (no window_size = whole-factor size from "scale"; too big for the screen =
;  reduced automatically, keeping 4:3)
; To try one: set mode=windowed and remove the ";" in front of one line.

; how the picture gets to the screen:
;   d3d11 = Direct3D 11 on the graphics card (recommended): scaling costs no CPU,
;           v-sync, better filters; falls back to gdi by itself if it cannot start
;   gdi   = classic Windows GDI drawing on the CPU (always works)
renderer=d3d11
; d3d11 only: wait for the monitor refresh (no tearing) 1 = on, 0 = off
vsync=1
; d3d11 only: flip = modern low-latency presentation (default);
;             blt  = older mode - try this if the intro videos do not show
swap=flip
; d3d11 only: which graphics card on PCs with two (e.g. Intel + NVIDIA laptops):
;   high = the fast/dedicated GPU (NVIDIA) - default; low = the integrated, power-saving one;
;   default = whatever Windows picks (usually the integrated one)
gpu=high

; how pixels are enlarged:
;   auto    = nearest for whole factors (2x, 3x), sharp for the rest (recommended)
;   nearest = blocky, pixel-exact; uneven at non-whole factors like 1.28x
;   sharp   = crisp but even at any size ("sharp bilinear")
;   linear  = smooth/soft at any size
;   scale2x = smooths diagonal edges of the pixel art (classic Scale2x/EPX;
;             d3d11 only - with gdi it falls back to sharp)
filter=auto

; keep the mouse inside the game picture while it is active (needed for edge
; scrolling); released when you switch away or move/resize the window
clip_cursor=1
; never tell the game it lost focus (it was written for exclusive fullscreen and
; can stay paused/frozen when windowed)
keep_focus=1
; tell Windows this game handles display scaling itself, so on displays set to
; 125%/150%/200% the picture is not stretched (and blurred) a second time
dpi_aware=1

[game]
; frames per second limit. On today's PCs the game draws hundreds of frames per
; second and, since the map moves a step per frame, edge scrolling is far too
; fast. 40 = controllable scrolling (default); lower = slower and more precise,
; e.g. 30; 0 = no limit (the original, very fast scrolling). Only whole-screen
; frames are paced - menus, dialogs and mouse highlights are never slowed down.
; (Not used with mode=fullscreen.)
max_fps=40
; 1 = skip the Firaxis/BreakAway logo videos at startup and go straight to the
; menu; 0 = play them (default)
skip_intro=0
; 1 = the mouse wheel zooms the battle map: each notch is one of the game's six
; zoom levels (wheel up = Z, zoom in; wheel down = X, zoom out). 0 = off
wheel_zoom=1

[debug]
; write smav2_ddraw.log next to the DLL
log=1
; developers: if the game stops responding or drawing, log where its code is stuck
; (briefly pauses the game thread to look at it - leave off for normal play)
hang_watchdog=0
; d3d11: save the picture of frame number N as smav2_d3d_dump.bmp (0 = off)
d3d_dump=0
